services:
  risk-seven:
    image: ghcr.io/${GITHUB_USER:-rahkun3}/risk-seven:latest
    build: .
    container_name: risk-seven
    restart: unless-stopped
    ports:
      - "${HOST_PORT:?Set HOST_PORT to a free host port}:8765"
    environment:
      HOST: "0.0.0.0"
      PORT: "8765"
      # Optional. Set this to your public https URL if you use a reverse proxy.
      # PUBLIC_URL: "https://riskseven.example.com"
