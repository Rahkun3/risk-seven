services:
  risk-seven:
    image: ghcr.io/${GITHUB_USER:-yourname}/risk-seven:latest
    build: .
    container_name: risk-seven
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      HOST: "0.0.0.0"
      PORT: "8765"
      # Optional. Set this to your public https URL if you use a reverse proxy.
      # PUBLIC_URL: "https://riskseven.example.com"
