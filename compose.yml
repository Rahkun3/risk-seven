services:
  risk-seven:
    image: ghcr.io/${GITHUB_USER:-rahkun3}/risk-seven:latest
    build: .
    container_name: ${CONTAINER_NAME:-risk-seven}
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    ports:
      - "${HOST_PORT:?Set HOST_PORT to a free host port}:${HOST_PORT}"
    environment:
      HOST: "0.0.0.0"
      PORT: "8765"
      # Optional. Set this to your public https URL if you use a reverse proxy.
      # PUBLIC_URL: "https://riskseven.example.com"
